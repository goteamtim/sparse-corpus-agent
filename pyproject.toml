[project]
name = "sparse-corpus-agent"
version = "0.0.1"
description = "Local-first, evidence-first CLI agent framework for repo exploration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tim" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-ai>=0.0.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
sca = "sca.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sca"]
